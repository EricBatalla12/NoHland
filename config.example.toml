# Configuracion de NoHland: ~/.config/nohland/config.toml
# Todas las claves son opcionales; lo que falte toma el valor de aqui.

# Carpeta de la que tira `nohland next` (sin subcarpetas, orden alfabetico).
# Por defecto, NoHland dentro de la carpeta de imagenes del sistema
# (~/Imágenes/NoHland, ~/Pictures/NoHland...). Se crea sola si no existe.
# directory = "~/Imágenes/NoHland"

# Monitor cuyo fondo da los colores a Noctalia. Vacio = el primero de
# Hyprland (id mas bajo). Con un video, la paleta sale de un fotograma suyo.
palette_monitor = ""

# Ajustes de un monitor concreto (el nombre es el de `hyprctl monitors`).
# directory: carpeta propia para `nohland next` en ese monitor.
# [monitors.DP-1]
# directory = "~/Imágenes/NoHland/vertical"

[rotation]
# Tiempo de rotacion de partida. Despues se cambia en la ventana (panel de la
# rotacion) o con `nohland rotate every <minutos>`, y lo que se cambie ahi
# manda sobre este valor. Tambien desde alli: encenderla, el orden y que
# fondos entran.
interval_minutes = 15

[video]
# Decodificacion por hardware de mpv. "auto-safe" elige sola lo que funciona
# con mpvpaper (en NVIDIA acaba en nvdec; en AMD/Intel, normalmente vaapi).
# Con NVIDIA puedes fijar "nvdec": fue lo que menos CPU gasto en las pruebas.
# "no" la desactiva.
hwdec = "auto-safe"
# Capa layer-shell de mpvpaper. "bottom" queda encima del fondo que dibuja
# Noctalia (capa background) y debajo de las ventanas.
layer = "bottom"
# Opciones extra de mpv, p. ej. [ "speed=0.5" ]. Sin espacios dentro.
mpv_options = []

[pause]
# Pausa si hay una ventana a pantalla completa en un workspace visible.
# Maximizar (SUPER+D) no cuenta: el fondo sigue viendose por los huecos.
fullscreen = true
# Pausa mientras el portatil funcione con bateria. En un equipo sin bateria
# no hace nada.
battery = true
# Pausa mientras la ventana activa tenga una de estas clases. Son expresiones
# regulares (sin distinguir mayusculas) contra class e initialClass; las ves
# con `hyprctl clients`.
classes = [
    "^steam$",                    # cliente de Steam y Big Picture
    "^steam_app_\\d+$",           # juegos de Steam / Proton
    "^(net\\.lutris\\.)?lutris$",
    "^heroic$",
    # "^gamescope$",
]
