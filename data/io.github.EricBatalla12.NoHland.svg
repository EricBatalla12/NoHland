<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icono de NoHland: un fondo de pantalla abrazado por la luna de Noctalia,
       con su paleta (amarillo de la luna, lavanda del buho, contorno marino). -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a5c"/>
      <stop offset="1" stop-color="#4a4fb4"/>
    </linearGradient>
    <clipPath id="dentro"><rect x="84" y="76" width="152" height="124" rx="24"/></clipPath>
  </defs>
  <g stroke="#0e0e43" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- la luna de Noctalia detras, como en su logo detras del buho -->
    <path d="M112.4 32.2 A98 98 0 1 0 209.1 166.0 A83 83 0 0 1 112.4 32.2 Z" fill="#fff59b"/>
    <!-- el fondo de pantalla, sentado en la luna -->
    <g clip-path="url(#dentro)" stroke="none">
      <rect x="84" y="76" width="152" height="124" fill="url(#cielo)"/>
      <g fill="#fff59b">
        <circle cx="196" cy="102" r="4.5"/><circle cx="214" cy="128" r="2.6"/>
        <circle cx="164" cy="112" r="2.4"/><circle cx="120" cy="100" r="2"/>
      </g>
      <path d="M84 170 L124 134 L150 156 L182 122 L236 166 L236 200 L84 200 Z" fill="#a9aefe"/>
      <path d="M84 184 Q136 162 180 178 T236 174 L236 200 L84 200 Z" fill="#f3edf7"/>
    </g>
    <rect x="84" y="76" width="152" height="124" rx="24" fill="none"/>
  </g>
</svg>
