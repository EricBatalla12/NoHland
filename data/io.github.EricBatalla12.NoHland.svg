<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icono de NoHland: un paisaje nocturno (Noctalia) dentro de un marco con
       el degradado cian-verde de los bordes de Hyprland. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a2b"/>
      <stop offset="0.55" stop-color="#2a1d6e"/>
      <stop offset="1" stop-color="#7a3fb8"/>
    </linearGradient>
    <linearGradient id="hypr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33ccff"/>
      <stop offset="1" stop-color="#00ff99"/>
    </linearGradient>
    <linearGradient id="monte-lejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3fa8"/>
      <stop offset="1" stop-color="#2d1f66"/>
    </linearGradient>
    <linearGradient id="monte-cerca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb6e8"/>
      <stop offset="1" stop-color="#12c98a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9c8ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d9c8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dentro">
      <rect x="20" y="20" width="216" height="216" rx="48"/>
    </clipPath>
  </defs>

  <!-- marco con el degradado de Hyprland -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#hypr)"/>

  <g clip-path="url(#dentro)">
    <rect x="20" y="20" width="216" height="216" fill="url(#cielo)"/>

    <!-- estrellas -->
    <g fill="#ffffff">
      <circle cx="58" cy="62" r="2.4" opacity="0.9"/>
      <circle cx="96" cy="44" r="1.6" opacity="0.7"/>
      <circle cx="122" cy="78" r="2" opacity="0.8"/>
      <circle cx="74" cy="104" r="1.4" opacity="0.6"/>
      <circle cx="44" cy="128" r="1.8" opacity="0.5"/>
      <circle cx="140" cy="48" r="1.3" opacity="0.6"/>
      <circle cx="212" cy="122" r="1.6" opacity="0.6"/>
    </g>

    <!-- luna creciente con halo -->
    <circle cx="176" cy="76" r="44" fill="url(#halo)"/>
    <path d="M176 46 a30 30 0 1 0 27 43 a24 24 0 1 1 -27 -43 z" fill="#fff1bf"/>

    <!-- montes: lejos en violeta, cerca con el degradado de Hyprland -->
    <path d="M20 176 L66 128 L98 158 L138 110 L186 160 L216 136 L236 152 L236 236 L20 236 z"
          fill="url(#monte-lejos)"/>
    <path d="M20 206 Q70 166 118 190 T236 178 L236 236 L20 236 z" fill="url(#monte-cerca)"/>
    <path d="M20 222 Q84 196 140 214 T236 206 L236 236 L20 236 z" fill="#0b6f63" opacity="0.85"/>
  </g>
</svg>
